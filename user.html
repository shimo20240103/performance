<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>受講チェック</title>

<style>
body{font-family:sans-serif;background:#f4f6f9;margin:0;}
.container{max-width:800px;margin:40px auto;padding:20px;}
.card{background:white;padding:20px;border-radius:15px;box-shadow:0 6px 18px rgba(0,0,0,0.1);margin-bottom:20px;}
select{padding:10px;width:100%;border-radius:8px;margin-bottom:20px;}
button{background:#0066ff;color:white;border:none;padding:8px 15px;border-radius:6px;}
</style>
</head>

<body>

<div class="container">
<h2>📚 受講チェック</h2>

<select id="employee">
<option>花岡</option>
<option>宮下</option>
<option>平良</option>
<option>清水</option>
<option>橋場</option>
<option>齊藤</option>
<option>鈴木</option>
<option>下崎</option>
<option>塩崎</option>
<option>竹ノ内</option>
</select>

<div id="courseList"></div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyXrQYPQOG83kJuzv5pcr8TVpxgpcO2JUj0EM15LHBY49-1EAnYggQh_F0VUts_PgSJ/exec";

async function fetchData(){
  const res = await fetch(API_URL);
  return await res.json();
}

async function updateStatus(courseId, completed){
  const employee=document.getElementById("employee").value;

  await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({
      action:"updateStatus",
      courseId,
      employee,
      completed
    })
  });
}

async function loadCourses(){
  const data = await fetchData();
  const div=document.getElementById("courseList");
  div.innerHTML="";

  data.courses.forEach(course=>{
    div.innerHTML+=`
      <div class="card">
        <strong>${course[1]}</strong><br>
        期日：${course[2]}<br><br>
        <input type="checkbox"
          onchange="updateStatus(${course[0]},this.checked)">
        受講済み
      </div>
    `;
  });
}

loadCourses();
</script>
</body>
</html>

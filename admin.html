<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>講習管理（管理者）</title>

<style>
body{
  font-family: "Segoe UI", sans-serif;
  background: #f4f6f9;
  margin: 0;
}

.container{
  max-width: 800px;
  margin: 40px auto;
  background: white;
  padding: 30px;
  border-radius: 15px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.1);
}

h1{
  text-align: center;
  color: #333;
}

.section{
  margin-bottom: 30px;
}

input, button{
  padding: 10px;
  margin-top: 5px;
  border-radius: 8px;
  border: 1px solid #ddd;
}

button{
  background: #0066ff;
  color: white;
  border: none;
  cursor: pointer;
}

button:hover{
  background: #004dcc;
}

.employee-list{
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.employee-tag{
  background: #e9f2ff;
  padding: 6px 10px;
  border-radius: 20px;
  font-size: 14px;
}

pre{
  background: #f0f0f0;
  padding: 10px;
  border-radius: 10px;
  overflow-x: auto;
}
</style>
</head>

<body>

<div class="container">

<h1>📋 講習管理（管理者）</h1>

<div class="section">
<h3>講座追加</h3>
講座名<br>
<input type="text" id="course" style="width:100%"><br><br>
期日<br>
<input type="date" id="deadline"><br><br>
<button onclick="addCourse()">追加する</button>
</div>

<div class="section">
<h3>社員追加</h3>
<input type="text" id="employee">
<button onclick="addEmployee()">追加</button>

<div class="employee-list" id="employeeList"></div>
</div>

<div class="section">
<h3>現在のデータ</h3>
<pre id="output"></pre>
</div>

</div>

<script>
let data = {
  employees:["花岡","宮下","平良","清水","橋場","齊藤","鈴木","下崎","塩崎","竹ノ内"],
  courses:[]
};

function renderEmployees(){
  const list = document.getElementById("employeeList");
  list.innerHTML="";
  data.employees.forEach(emp=>{
    list.innerHTML += `<div class="employee-tag">${emp}</div>`;
  });
}

function addCourse(){
  const course = document.getElementById("course").value;
  const deadline = document.getElementById("deadline").value;

  if(!course || !deadline){
    alert("入力してください");
    return;
  }

  data.courses.push({
    name:course,
    deadline:deadline,
    status:{}
  });

  alert("講座を追加しました");
  showData();
}

function addEmployee(){
  const name = document.getElementById("employee").value;
  if(!name) return;

  data.employees.push(name);
  renderEmployees();
  showData();
}

function showData(){
  document.getElementById("output").textContent =
    JSON.stringify(data,null,2);
}

renderEmployees();
showData();
</script>

</body>
</html>

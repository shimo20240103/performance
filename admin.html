<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>講習管理（管理者）</title>

<style>
body{font-family:sans-serif;background:#f4f6f9;margin:0;}
.container{max-width:900px;margin:40px auto;background:white;padding:30px;border-radius:15px;box-shadow:0 8px 20px rgba(0,0,0,0.1);}
h2{margin-top:0;}
input,button{padding:10px;border-radius:8px;border:1px solid #ddd;}
button{background:#0066ff;color:white;border:none;cursor:pointer;}
button:hover{background:#004dcc;}
.course{background:#f9f9f9;padding:15px;margin-top:10px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;}
.delete{background:red;border:none;color:white;border-radius:50%;width:28px;height:28px;cursor:pointer;font-weight:bold;}
</style>
</head>

<body>
<div class="container">
<h2>📋 講座追加</h2>

<input type="text" id="name" placeholder="講座名" style="width:100%"><br><br>
<input type="date" id="deadline">
<button onclick="addCourse()">追加</button>

<h2>📚 講座一覧</h2>
<div id="courseList"></div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxDlL2cwHvstUV0yTWswgKsS9B86pp0K0i2c6XkjqkPigZkDVu9DYc7nI9gQnJzkFwm/exec";

async function fetchData(){
  const res = await fetch(API_URL);
  return await res.json();
}

async function addCourse(){
  const name=document.getElementById("name").value;
  const deadline=document.getElementById("deadline").value;

  if(!name || !deadline){
    alert("入力してください");
    return;
  }

  await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({
      action:"addCourse",
      name,
      deadline
    })
  });

  document.getElementById("name").value="";
  loadCourses();
}

async function deleteCourse(id){
  if(!confirm("削除しますか？")) return;

  await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({
      action:"deleteCourse",
      id
    })
  });

  loadCourses();
}

async function loadCourses(){
  const data = await fetchData();
  const div=document.getElementById("courseList");
  div.innerHTML="";

  data.courses.forEach(course=>{
    div.innerHTML+=`
      <div class="course">
        <div>
          <strong>${course[1]}</strong><br>
          期日：${course[2]}
        </div>
        <button class="delete" onclick="deleteCourse(${course[0]})">×</button>
      </div>
    `;
  });
}

loadCourses();
</script>
</body>
</html>
